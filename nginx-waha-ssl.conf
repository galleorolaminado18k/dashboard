# ✅ NGINX CON SSL PARA WAHA (producción)
# Ubicación: /etc/nginx/sites-available/waha.conf

server {
    listen 80;
    server_name waha.tudominio.com;

    # Redirigir HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name waha.tudominio.com;

    # ✅ Certificados SSL (Let's Encrypt)
    # Obtener con: certbot --nginx -d waha.tudominio.com
    ssl_certificate /etc/letsencrypt/live/waha.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waha.tudominio.com/privkey.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Tamaño de cuerpo de solicitud (para subir archivos grandes)
    client_max_body_size 50M;

    location / {
        # Proxy a WAHA en Docker
        proxy_pass http://localhost:3000;

        # Headers necesarios para WebSocket (QR en tiempo real)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (WhatsApp puede tardar)
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # Health check público
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }
}

