services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    volumes:
      - ./evolution-data:/evolution/store
    expose:
      - "8080"
    environment:
      # Sin autenticación por defecto
      - AUTHENTICATION_API_KEY=

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - evolution

volumes:
  caddy_data:
  caddy_config:

