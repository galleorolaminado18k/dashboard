app = "waha-production"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile.waha"

[env]
  WAHA_HTTP_API_HOST = "0.0.0.0"
  WAHA_MULTI_DEVICE = "true"
  WAHA_LOG_LEVEL = "info"
  PORT = "3000"

[[services]]
  http_checks = []
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    restart_limit = 0
    timeout = "5s"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
