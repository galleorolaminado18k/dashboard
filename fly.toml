## 🎯 SOLUCIÓN DEFINITIVA VPS 24/7

**Error actual:** `WAHA_UNREACHABLE` - Vercel no puede conectar con WAHA
**Solución:** Deploy WAHA en Railway.app (VPS gratis $5 crédito/mes)

---

## 🔴 OPCIÓN 1: DEPLOY MANUAL RAILWAY (5 MINUTOS)

### **Paso 1: Ir a Railway**
```
https://railway.app/new
```

### **Paso 2: Login con GitHub**
```
Click: "Login with GitHub"
Autorizar Railway
```

### **Paso 3: Deploy desde GitHub**
```
1. Click: "Deploy from GitHub repo"
2. Buscar: "dashboard"
3. Seleccionar: galleorolaminado18k/dashboard
4. Click: "Deploy Now"
```

### **Paso 4: Configurar Servicio WAHA**
```
Railway detectará el proyecto automáticamente.

En el Dashboard:
1. Click en el servicio creado
2. Settings → Variables
3. Agregar estas variables:

WAHA_HTTP_API_HOST = 0.0.0.0
WAHA_MULTI_DEVICE = true
WAHA_LOG_LEVEL = info
PORT = 3000
```

### **Paso 5: Generar Dominio Público**
```
1. Settings → Networking
2. Click: "Generate Domain"
3. Se creará algo como: waha-production-xyz123.up.railway.app
4. ✅ COPIAR ESTA URL
```

### **Paso 6: Configurar en Vercel**
```
1. Ir a: https://vercel.com/dashboard
2. Seleccionar: tu proyecto dashboard
3. Settings → Environment Variables
4. Click: "Add New"

Name:  WAHA_BASE_URL
Value: https://waha-production-xyz123.up.railway.app
        (PEGAR LA URL DE RAILWAY AQUÍ)

Apply to:
☑ Production
☑ Preview
☑ Development

5. Click: "Save"
6. Vercel hará redeploy automático (esperar 1-2 min)
```

### **Paso 7: VERIFICAR FUNCIONANDO**
```
1. Esperar 2-3 minutos a que Railway despliegue WAHA
2. Ir a: https://dashboard-galle.vercel.app/configuracion
3. Ingresar: +57 3012439596
4. Click: "Conectar WhatsApp"
5. ✅ DEBE APARECER QR SIN ERROR
6. Escanear QR con WhatsApp Business
7. ✅ LISTO - FUNCIONA 24/7
```

