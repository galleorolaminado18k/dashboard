## 🆘 SI ALGO FALLA

### **Railway: No aparece el repo**
```
1. Ir a GitHub → Settings → Applications
2. Railway → Configure
3. Repository access → Seleccionar dashboard
4. Save
5. Volver a Railway y refrescar
```

### **Fly: Error de instalación CLI**
```
# PowerShell como Administrador
Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
iwr https://fly.io/install.ps1 -useb | iex
```

### **Vercel: Sigue error después de configurar**
```
1. Verificar variable WAHA_BASE_URL existe
2. Verificar URL es HTTPS (no HTTP)
3. Deployments → último → "Redeploy"
4. Esperar 2 minutos
5. Probar de nuevo
```

### **WAHA no responde en Railway/Fly**
```
# Test
curl https://tu-waha-url.com/health

# Ver logs
Railway: Dashboard → View Logs
Fly: fly logs
Render: Dashboard → Logs

# Buscar: "Server started on port 3000"
```

