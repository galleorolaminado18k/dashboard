## 🔴 OPCIÓN 2: FLY.IO (100% GRATIS, MÁS RÁPIDO)

Si Railway no funciona, usa Fly.io (también 24/7 gratis):

### **Paso 1: Instalar Fly CLI**
```powershell
# Abrir PowerShell como Administrador
iwr https://fly.io/install.ps1 -useb | iex
```

### **Paso 2: Login**
```bash
fly auth signup
# Crear cuenta con email
# Verificar email
```

### **Paso 3: Crear fly.toml**

Crear archivo `fly.toml` en la raíz del proyecto:

```toml
app = "waha-production"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile.waha"

[env]
  WAHA_HTTP_API_HOST = "0.0.0.0"
  WAHA_MULTI_DEVICE = "true"
  WAHA_LOG_LEVEL = "info"
  PORT = "3000"

[[services]]
  http_checks = []
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    restart_limit = 0
    timeout = "5s"
```

### **Paso 4: Deploy**
```bash
cd C:\Users\USUARIO\WebstormProjects\dashboard
fly launch --no-deploy
fly deploy
```

### **Paso 5: Obtener URL**
```bash
fly status
# Copiar URL: https://waha-production.fly.dev
```

### **Paso 6: Configurar en Vercel**
```
WAHA_BASE_URL = https://waha-production.fly.dev
```

