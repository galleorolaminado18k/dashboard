services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./evolution-data:/evolution/store
    environment:
      # ✅ Configurar autenticación (recomendado para producción)
      # Opción 1: Sin autenticación (solo desarrollo local)
      # API_KEY:

      # Opción 2: Con autenticación (recomendado)
      API_KEY: galle-super-key              # ← Cambia esto por tu clave personalizada

      # Nota: Algunas versiones de Evolution usan:
      # AUTHENTICATION_API_KEY: galle-super-key

      # ⚠️ Importante: La misma clave debe configurarse en Vercel como EVO_API_KEY

