services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./evolution-data:/evolution/store
    environment:
      # ✅ CONFIGURAR AUTENTICACIÓN (obligatorio para producción)
      # Evolution API acepta diferentes nombres de variable según la versión:

      # Opción 1: API_KEY (más común)
      API_KEY: "galle-super-key"

      # Opción 2: AUTHENTICATION_API_KEY (algunas versiones)
      # AUTHENTICATION_API_KEY: "galle-super-key"

      # Opción 3: Sin autenticación (SOLO para desarrollo local)
      # API_KEY: ""

      # ⚠️ IMPORTANTE:
      # 1. Cambia "galle-super-key" por una clave segura personalizada
      # 2. La MISMA clave debe configurarse en Vercel como EVO_API_KEY
      # 3. Para ver qué variable usa tu versión: docker logs evolution-api | grep -i auth

