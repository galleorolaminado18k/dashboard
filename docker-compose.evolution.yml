services:
  evolution:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./evolution-data:/evolution/store
    environment:
      # Desactivar autenticación (más simple para empezar)
      - AUTHENTICATION_API_KEY=
      # O si quieres activar autenticación, pon una clave:
      # - AUTHENTICATION_API_KEY=tu-clave-secreta-aqui

