version: '3.8'

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: always
    environment:
      # CRITICAL: Escuchar en 0.0.0.0 para aceptar conexiones externas
      WAHA_HTTP_API_HOST: "0.0.0.0"
      WAHA_LICENSE_ACCEPT: "true"
      WAHA_LOG_LEVEL: "info"
      WAHA_MULTI_DEVICE: "true"

      # NO USAR API KEY EN CORE/WEBJS - Solo funciona en Plus
      # Proteger con firewall en su lugar

    ports:
      - "3000:3000"
    volumes:
      - ./waha-data:/app/data

volumes:
  waha-data:

